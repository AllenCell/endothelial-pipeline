name: window_sweep_start_cell_piling
workflow: sweep_window_fixed_points
parameters:
  patch_type: grid_based
  sweep_interval_minutes: 30
  sweep_interval_timepoints: 6
  num_bootstrap_iterations: 500
  bootstrap_match_radius: 0.3
columns:
  window_edge_timepoint: Time in frame number of swept edge
  window_edge_minutes: Time in minutes of swept edge
  swept_boundary: Which window edge moved in sweep
  num_window_timepoints: Number of window timepoints (rows pooled across all FOVs)
  dataset: Name of dataset
  shear_stress_bin: Shear stress bin corresponding to flow condition
  shear_stress: Shear stress value [dyn/cm^2]
  stability: Stability classification of a fixed point
  polar_r_fixed_point: Vector field fixed point location in r
  polar_theta_fixed_point: Vector field fixed point location in theta
  rho_fixed_point: Vector field fixed point location in rho
  detection_rate: Fraction of bootstrap iterations in which a matched fixed point was found
